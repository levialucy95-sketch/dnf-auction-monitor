name: collect

# 한 번 실행하면 3분 간격으로 18라운드(약 54분) 수집한 뒤 한 번 커밋한다.
# 피로 회복의 영약은 거래가 1분에 10건 넘게 일어나서, 시세 API가 주는
# 최근 100건을 놓치지 않으려면 간격이 짧아야 한다.
#
# GitHub는 정기 실행을 자주 건너뛰고, 정각에는 특히 심하다. 그래서 정각을 피해
# 15분마다 요청하고, 아래 concurrency로 실행 중이면 한 개만 대기시킨다.
# 앞 실행이 끝나면 대기 중인 실행이 바로 이어받아 수집이 거의 끊기지 않는다.
# (대기열에 밀려난 요청은 cancelled로 남는데, 정상이다)
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 실행이 늦어져 겹치면 앞 실행이 끝날 때까지 기다린다 (같은 파일에 동시에 쓰지 않도록)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
        # -u: 출력 버퍼링을 꺼서 라운드마다 로그가 바로 보이게 한다
        run: python -u collect.py --rounds 18 --interval 180

      # 수집이 중간에 실패해도 그때까지 모은 데이터는 커밋한다
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase
          git push
